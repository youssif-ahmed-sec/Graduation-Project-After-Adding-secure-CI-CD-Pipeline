
env:
  contexts:
    - name: filetrack-api
      urls:
        - http://127.0.0.1:5000/
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10

  - type: requestor
    requests:
      - name: Backend health
        url: http://127.0.0.1:5000/healthz
        method: GET
        responseCode: 200

      - name: Unauthorized agent registration
        url: http://127.0.0.1:5000/api/v1/register
        method: POST
        headers:
          - "Content-Type: application/json"
        data: '{"agent_id":"dast-unauthorized-agent","metadata":{}}'
        responseCode: 403

      - name: Unauthorized heartbeat
        url: http://127.0.0.1:5000/api/v1/heartbeat
        method: POST
        headers:
          - "Content-Type: application/json"
        data: '{"agent_id":"dast-unauthorized-agent"}'
        responseCode: 403

      - name: Unauthorized SuperAdmin approval
        url: http://127.0.0.1:5000/api/v1/admin/agents/approve
        method: POST
        headers:
          - "Content-Type: application/json"
        data: '{"agent_id":"dast-unauthorized-agent"}'
        responseCode: 401

  - type: passiveScan-wait
    parameters:
      maxDuration: 3

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/
      reportFile: zap-report.html
      reportTitle: FileTrack API Security Scan

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/
      reportFile: zap-report.json
      reportTitle: FileTrack API Security Scan

  - type: exitStatus
    parameters:
      errorLevel: Medium
