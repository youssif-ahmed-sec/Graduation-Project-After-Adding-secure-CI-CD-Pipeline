name: FileTrack Security Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    name: Python Security Regression Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DB_NAME: filetrack_enrollment_test
      DB_USER: postgres
      DB_PASS: ci-only-postgres-test-password
      DB_HOST: 127.0.0.1
      DB_PORT: "55432"
      FILETRACK_RUN_PG_INTEGRATION: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: filetrack_enrollment_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-test-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d filetrack_enrollment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi8 \
            shared-mime-info

      - name: Install security test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            Flask \
            Flask-SocketIO \
            gevent \
            PyJWT \
            Werkzeug \
            Pillow \
            WeasyPrint \
            requests \
            psycopg2-binary

      - name: Check Python syntax
        run: |
          python -m py_compile \
            agent/security.py \
            agent/client.py \
            agent/modules/response_engine.py \
            server/security.py \
            server/app.py \
            server/pdf_renderer.py \
            server/db_manager.py
      - name: Verify PostgreSQL test database
        run: |
          python - <<'PY'
          import os
          import psycopg2

          connection = psycopg2.connect(
              dbname=os.environ["DB_NAME"],
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASS"],
              host=os.environ["DB_HOST"],
              port=os.environ["DB_PORT"],
              connect_timeout=5,
          )

          try:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT current_database()")
                  database_name = cursor.fetchone()[0]

              assert database_name == "filetrack_enrollment_test"
              print("PostgreSQL integration database is ready")
          finally:
              connection.close()
          PY

      - name: Run security regression tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v

      - name: Verify mandatory PostgreSQL integration test
        run: |
          python - <<'PY'
          import os
          import unittest

          assert os.environ.get("FILETRACK_RUN_PG_INTEGRATION") == "1"

          suite = unittest.defaultTestLoader.discover(
              start_dir="tests",
              pattern="test_postgres_agent_enrollment.py",
          )

          assert suite.countTestCases() == 1, (
              "PostgreSQL integration test was not discovered"
          )

          result = unittest.TextTestRunner(verbosity=2).run(suite)

          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(
                  "Mandatory PostgreSQL integration test failed or skipped"
              )
          PY

  secret-scanning:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install Gitleaks
        run: |
          set -euo pipefail

          VERSION="8.30.1"
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"

          curl -fsSL -o "$ARCHIVE" "${BASE_URL}/${ARCHIVE}"
          curl -fsSL -o checksums.txt \
            "${BASE_URL}/gitleaks_${VERSION}_checksums.txt"

          grep " ${ARCHIVE}$" checksums.txt | sha256sum --check

          mkdir -p "$HOME/.local/bin"
          tar -xzf "$ARCHIVE" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan repository files
        run: |
          gitleaks dir . --redact --no-banner
  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.183.0

      - name: Run Semgrep security audit
        run: |
          semgrep scan \
            --config p/security-audit \
            --metrics off \
            --error \
            admin agent server

  dependency-scanning:
    name: Python Dependency Vulnerability Scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit server dependencies
        run: |
          python -m pip_audit -r server/requirements.txt

      - name: Audit admin dependencies
        run: |
          python -m pip_audit -r admin/requirements.txt

  docker-build:
    name: Docker Build and Container Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    needs:
      - security-tests
      - secret-scanning
      - semgrep-sast
      - dependency-scanning
      - infrastructure-validation
      - trufflehog-secret-scanning

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -f server/Dockerfile \
            -t filetrack-mini-edr:ci \
            ./server

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: filetrack-mini-edr:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="sha-${GITHUB_SHA}"

          docker tag \
            filetrack-mini-edr:ci \
            "${IMAGE_REPO}:${IMAGE_TAG}"

          docker push "${IMAGE_REPO}:${IMAGE_TAG}"

          echo "Published image: ${IMAGE_REPO}:${IMAGE_TAG}"

  infrastructure-validation:
    name: Terraform and Kubernetes Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check

      - name: Initialize Terraform
        run: terraform -chdir=infra/terraform init -backend=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform -chdir=infra/terraform validate

      - name: Install Kubeconform
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.7.0"
          ARCHIVE="kubeconform-linux-amd64.tar.gz"
          BASE_URL="https://github.com/yannh/kubeconform/releases/download/v${VERSION}"

          curl -fsSL -o "$ARCHIVE" "${BASE_URL}/${ARCHIVE}"

          mkdir -p "$HOME/.local/bin"
          tar -xzf "$ARCHIVE" -C "$HOME/.local/bin" kubeconform

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -exit-on-error \
            infra/k8s/

  trufflehog-secret-scanning:
    name: TruffleHog Git History Secret Scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with TruffleHog
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9
        with:
          base: ""
          head: ${{ github.sha }}
          version: "3.99.2"
          extra_args: --results=verified,unknown
