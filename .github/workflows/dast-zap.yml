
name: FileTrack DAST - OWASP ZAP

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline - Isolated Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Generate temporary test secrets
        shell: bash
        run: |
          set -euo pipefail

          echo "DB_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AGENT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AGENT_CREDENTIAL_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start isolated PostgreSQL and backend
        run: docker compose up -d --build

      - name: Wait for backend health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:5000/healthz || true)

            if [[ "$STATUS" == "200" ]]; then
              echo "Backend health endpoint returned HTTP 200"
              exit 0
            fi

            sleep 2
          done

          echo "Backend health check failed"
          docker compose ps
          exit 1

      - name: Test unauthenticated API access
        shell: bash
        run: |
          set -euo pipefail

          check_status() {
            local name="$1"
            local expected="$2"
            local url="$3"
            local payload="$4"

            actual=$(curl --silent --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 10 \
              --header "Content-Type: application/json" \
              --request POST \
              --data "$payload" \
              "$url")

            if [[ "$actual" != "$expected" ]]; then
              echo "FAIL: $name returned HTTP $actual, expected $expected"
              exit 1
            fi

            echo "PASS: $name rejected unauthenticated access"
          }

          BASE_URL="http://127.0.0.1:5000/api/v1"

          check_status \
            "Agent registration" \
            "403" \
            "$BASE_URL/register" \
            '{"agent_id":"dast-unauthorized-agent","metadata":{}}'

          check_status \
            "Agent heartbeat" \
            "403" \
            "$BASE_URL/heartbeat" \
            '{"agent_id":"dast-unauthorized-agent"}'

          check_status \
            "SuperAdmin approval" \
            "401" \
            "$BASE_URL/admin/agents/approve" \
            '{"agent_id":"dast-unauthorized-agent"}'

      - name: Prepare report directory
        run: |
          mkdir -p zap-reports
          cp .github/zap-api-plan.yaml zap-reports/zap-api-plan.yaml
          sudo chown -R 1000:1000 zap-reports


      - name: Run OWASP ZAP API Passive Scan
        run: |
          docker run --rm \
            --network host \
            -v "${PWD}/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd \
            -autorun /zap/wrk/zap-api-plan.yaml
      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filetrack-zap-baseline-report
          path: zap-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop temporary environment
        if: always()
        run: docker compose down -v --remove-orphans
