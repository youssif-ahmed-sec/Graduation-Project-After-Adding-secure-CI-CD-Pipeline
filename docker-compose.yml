services:
  db:
    image: postgres:15-alpine
    container_name: miniedr_postgres
    environment:
      POSTGRES_DB: filetrack_db
      POSTGRES_USER: youssifahmed
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: "no"

  server:
    build: ./server
    container_name: miniedr_server
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: filetrack_db
      DB_USER: youssifahmed
      DB_PASS: ${DB_PASSWORD:?DB_PASSWORD is required}
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:?AGENT_SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata: