
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filetrack-server
  labels:
    app: filetrack-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filetrack-server
  template:
    metadata:
      labels:
        app: filetrack-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: server
          image: ghcr.io/REPLACE_OWNER/REPLACE_REPO:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "filetrack_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: filetrack-secrets
                  key: db-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: filetrack-secrets
                  key: db-password
            - name: AGENT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: filetrack-secrets
                  key: agent-secret-key
            - name: AGENT_CREDENTIAL_PEPPER
              valueFrom:
                secretKeyRef:
                  name: filetrack-secrets
                  key: agent-credential-pepper
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: filetrack-secrets
                  key: jwt-secret-key
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: filetrack-server
spec:
  type: ClusterIP
  selector:
    app: filetrack-server
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
